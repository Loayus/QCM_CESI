    code: |
      def search(node, x):
          if node is None:
              return False
          if x == node.value:
              return True
          if x < node.value:
              return search(node.left, x)
          else:
              return search(node.right, x)
    propositions:
      - {texte: "$O(n)$"}
      - {texte: "$O(n^2)$"}
      - {texte: "$O(1)$"}
      - {texte: "$O(e^n)$"}
      - {texte: "$O(\\log n)$", correcte: true}


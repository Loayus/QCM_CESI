  - id: 45
    type: unique
    enonce: "Le parchemin commence par « 9153 ». Quel résultat donne le déchiffrement de ce message, chiffré par un décalage de César de clé $K = 4$ (modulo 10) ?"
    propositions:
      - {texte: "3597"}
      - {texte: "5311"}
      - {texte: "5719", correcte: true}
      - {texte: "4608"}
      - {texte: "9153"}
    explication: |
      Chaque chiffre est remplacé par (c − 4) mod 10 : 9 → 5, 1 → 7 (car −3 mod 10 = 7), 5 → 1 et 3 → 9 (car −1 mod 10 = 9). On retrouve bien le début de la latitude, 57°19'. Chaque distracteur correspond à une erreur type :
      • 3597 : le décalage est appliqué dans le mauvais sens (+4).
      • 5311 : la valeur absolue est utilisée à la place du modulo (|1 − 4| = 3 et |3 − 4| = 1).
      • 4608 : la clé utilisée est K = 5.
      • 9153 : aucun déchiffrement n'a été appliqué.

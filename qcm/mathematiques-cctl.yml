  - id: 40
    type: unique
    enonce: "Un graphe simple est un graphe qui :"
    propositions:
      - {texte: "Ne contient ni arêtes multiples entre deux sommets distincts, ni boucles.", correcte: true}
      - {texte: "Peut contenir des arêtes multiples entre deux sommets, mais pas de boucles."}
      - {texte: "Ne contient aucun cycle."}
      - {texte: "Est nécessairement connexe."}
      - {texte: "Peut relier un sommet à lui-même par une arête, à condition qu'il n'y ait pas d'arêtes multiples."}
    explication: |
      1. VRAI : c'est la définition d'un graphe simple : ni arêtes multiples, ni boucles.
      2. FAUX : un graphe avec des arêtes multiples est un multigraphe.
      3. FAUX : un graphe simple peut contenir des cycles (par exemple un triangle) ; c'est un arbre qui n'en contient pas.
      4. FAUX : la connexité ne fait pas partie de la définition ; un graphe simple peut avoir plusieurs composantes.
      5. FAUX : une arête reliant un sommet à lui-même est une boucle, interdite dans un graphe simple.


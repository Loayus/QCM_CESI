      - {texte: "Augmenter systématiquement les ressources matérielles allouées pour garantir la performance perçue."}
      - {texte: "Supprimer systématiquement le code mort, les dépendances et les fonctionnalités inutilisées.", correcte: true}
      - {texte: "Adapter la fréquence de rafraîchissement et de polling aux besoins réels de l'utilisateur.", correcte: true}
      - {texte: "Multiplier les micro-services pour découper finement chaque fonctionnalité, quel que soit le besoin."}
    explication: |
      1. VRAI : un algorithme et une structure de données adaptés réduisent le temps CPU et la mémoire consommés.
      2. FAUX : surdimensionner le matériel augmente la consommation et l'empreinte de fabrication, ce qui va à l'opposé de la sobriété.
      3. VRAI : le code mort, les dépendances et les fonctionnalités inutilisées alourdissent le logiciel, son téléchargement et son exécution sans rien apporter.
      4. VRAI : un polling trop fréquent multiplie les requêtes réseau et réveille inutilement les terminaux.
      5. FAUX : chaque micro-service ajoute des conteneurs, des appels réseau et de la sérialisation. Découper sans besoin réel crée une surcharge.


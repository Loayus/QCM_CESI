# Liste des QCM affichés sur la page d'accueil (dans cet ordre).
# Pour ajouter un QCM : déposer son .yml dans ce dossier, ses images dans images/<nom>/, puis l'ajouter ici.
#   icone  : calculator | code | book | brain | flask | globe | bank
#   couleur: violet | bleu | vert | orange
qcm:
  - fichier: mathematiques-cctl.yml
    titre: "Mathématiques"
    icone: calculator
    couleur: violet
  - fichier: sciences-numerique-cctl.yml
    titre: "Sciences du numérique"
    icone: code
    couleur: bleu
  - fichier: annales-2025-2026-mathematiques-initial.yml
    titre: "Annales Maths 2025-26 - Initial"
    icone: calculator
    couleur: vert
  - fichier: annales-2025-2026-mathematiques-rattrapage.yml
    titre: "Annales Maths 2025-26 - Rattrapage"
    icone: calculator
    couleur: vert
  - fichier: annales-2025-2026-numerique-initial.yml
    titre: "Annales Numérique 2025-26 - Initial"
    icone: code
    couleur: orange
  - fichier: annales-2025-2026-numerique-rattrapage.yml
    titre: "Annales Numérique 2025-26 - Rattrapage"
    icone: code
    couleur: orange

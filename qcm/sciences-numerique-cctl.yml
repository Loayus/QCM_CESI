# QCM : Sciences fondamentales - Sciences du numérique (CCTL)
# Source : correction de l'examen du 15/11/2026 (dossier ressources/)
#
# Format d'une question :
#   type: unique | multiple   -> radio (1 seule case) | cases à cocher
#   enonce:                   -> texte ; `code` en backticks, formules en $...$ (LaTeX)
#   code: |                   -> (optionnel) bloc de code / tableau / schéma affiché sous l'énoncé
#   propositions:             -> liste ordonnée A, B, C... ; correcte: true sur les bonnes réponses
#   explication:              -> (optionnel) commentaire affiché dans la correction

titre: "Sciences fondamentales - Sciences du numérique (CCTL)"
note_sur: 20

# Barème déduit de la copie corrigée.
# Clé = nombre de discordances (case cochée à tort OU bonne case non cochée).
# Au-delà de la dernière clé listée : 0 point. Aucune réponse : 0 point.
# Une question qui n'a qu'UNE bonne réponse vaut 1 ou 0 (barème `unique`), même si son type est `multiple`.

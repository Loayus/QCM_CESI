  - id: 29
    type: multiple
    enonce: "Soit le code suivant en Python (≥ 3.7), sélectionner les **propositions correctes** : (2 propositions)"
    code: |
      d = dict()
      d["3"] = "foo"
      d["2"] = "bar"
      # === BREAK POINT 1 ===
      print(d)
      d["2"] = "baz"
      del d["3"]
      # === BREAK POINT 2 ===
      print(d["2"])
      print(d.get("3"))
      # === BREAK POINT 3 ===
      d = dict()
      d[(1, 2)] = "foo"
      d[[1, 2]] = "bar"
      print(d)
    propositions:
      - {texte: "Le BREAK POINT 1 affichera : {'2': 'bar', '3': 'foo'}."}
      - {texte: "Le BREAK POINT 2 affichera baz, puis soulèvera une erreur KeyError."}
      - {texte: "Le BREAK POINT 2 affichera baz, puis None", correcte: true}
      - {texte: "Le BREAK POINT 3 déclenchera une erreur TypeError: unhashable type: 'tuple' à l'instruction d[(1, 2)] = \"foo\""}
      - {texte: "Le BREAK POINT 3 déclenchera une erreur TypeError: unhashable type: 'list' à l'instruction d[[1, 2]] = \"bar\"", correcte: true}
    explication: |
      A faux. Depuis Python 3.7, un dict conserve l'ordre d'insertion. On obtient donc {'3': 'foo', '2': 'bar'}, et non {'2': 'bar', '3': 'foo'}.
      B faux. `d.get("3")` renvoie None quand la clé est absente. C'est `d["3"]` qui lèverait une KeyError.
      C vrai : baz puis None.
      D faux. Un tuple est immuable, donc hachable, et peut servir de clé.
      E vrai. Une liste est mutable, donc non hachable.

  - id: 30
    type: multiple
    enonce: "En considérant le code suivant en Python (≥ 3.7), sélectionner les **affirmations correctes** : (3 propositions)"
    code: |
      d = {"a": 1, "b": 2, "c": 3}
    propositions:
      - {texte: "d[\"a\"] = 10 s'exécute en O(1) moyen grâce au hash de la clé, indépendamment du nombre d'éléments dans d.", correcte: true}
      - {texte: "\"a\" in d s'exécute en O(1) moyen car on hashe la clé au lieu de parcourir toutes les clés existantes.", correcte: true}
      - {texte: "10 in d.values() s'exécute en O(1) car les valeurs sont indexées par hash comme les clés."}
      - {texte: "len(d) s'exécute en O(1) car ce compteur est maintenu à jour à chaque insertion/suppression, indépendamment du hachage.", correcte: true}
      - {texte: "sorted(d.keys()) s'exécute en O(1) car les clés sont déjà indexées."}
    explication: |
      1. VRAI : le hash de la clé donne directement la case, sans parcours (O(n) dans le pire cas).
      2. VRAI : on hache "a" et on regarde la case correspondante, sans parcourir les clés.
      3. FAUX : seules les clés sont hachées. Chercher une valeur demande un parcours en O(n).
      4. VRAI : le dict stocke un compteur d'éléments mis à jour à chaque modification.
      5. FAUX : le hachage ne range pas les clés dans l'ordre, et le tri coûte O(n log n).

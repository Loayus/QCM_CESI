  - id: 21
    type: multiple
    image: "sciences-numerique/q21.png"
    enonce: "On considère le graphe suivant. On part du sommet A et les voisins d'un sommet sont visités par ordre alphabétique. Quel est l'ordre de première visite des sommets avec l'algorithme **DFS** ? (une seule bonne réponse)"
    propositions:
      - {texte: "A, B, C, D, E"}
      - {texte: "A, C, B, D, E"}
      - {texte: "A, B, D, E, C", correcte: true}
      - {texte: "E, D, B, C, A"}
      - {texte: "A, B, D, C, E"}
    explication: |
      DFS suit un chemin le plus loin possible avant de revenir en arrière, en visitant les voisins par ordre alphabétique. Depuis A, on va en B, puis en D, puis en E (cul-de-sac). On remonte jusqu'à A pour visiter C. Ordre final : A, B, D, E, C.
      • A, B, C, D, E : c'est un parcours en largeur (BFS).
      • A, C, B, D, E : c'est un ordre DFS possible, mais qui ne respecte pas l'ordre alphabétique.
      • E, D, B, C, A : c'est l'ordre de fin de traitement (post-ordre), pas l'ordre de première visite.
      • A, B, D, C, E : le parcours revient en arrière avant d'avoir exploré E, le voisin de D.

  - id: 22
    type: multiple
    enonce: "Que représente la variable `graph` définie ci-dessous ? (une seule bonne réponse)"
    code: |
      graph = [
          [0, 1, 1],
          [1, 0, 0],
          [1, 0, 0]
      ]
    propositions:
      - {texte: "Une liste d'adjacence d'un graphe à 3 sommets."}
      - {texte: "La matrice d'adjacence d'un graphe non orienté à 3 sommets et 2 arêtes.", correcte: true}
      - {texte: "La matrice d'adjacence d'un graphe non orienté à 3 sommets et 3 arêtes."}
      - {texte: "La matrice d'adjacence d'un graphe orienté à 3 sommets et 2 arcs."}
      - {texte: "La matrice d'incidence d'un graphe à 3 sommets et 3 arêtes."}
    explication: |
      `graph[i][j]` vaut 1 si les sommets i et j sont reliés, 0 sinon : c'est une matrice d'adjacence. Elle est symétrique, donc le graphe est non orienté. Elle contient quatre 1, et chaque arête est comptée deux fois (`graph[i][j]` et `graph[j][i]`) : le graphe a donc 2 arêtes, 0–1 et 0–2.
      • Liste d'adjacence : elle associerait à chaque sommet la liste de ses voisins, par exemple {0: [1, 2], 1: [0], 2: [0]}.
      • 3 arêtes : ce serait un triangle, avec aussi `graph[1][2] = graph[2][1] = 1`.
      • Graphe orienté à 2 arcs : la matrice ne contiendrait que deux 1, par exemple `graph[0][1]` et `graph[0][2]` ; ici, elle est symétrique.
      • Matrice d'incidence : elle croise les sommets et les arêtes (une colonne par arête) ; avec 3 arêtes, chaque colonne contiendrait exactement deux 1, ce qui n'est pas le cas ici.

  - id: 23
    type: multiple
    enonce: "Quelle instruction faut-il exécuter pour que ce dictionnaire représente un graphe non orienté ? (une seule bonne réponse)"
    code: |
      graph = {'A': ['B', 'C'], 'B': [], 'C': ['A']}
    propositions:
      - {texte: "graph['B'].append('A')", correcte: true}
      - {texte: "graph['A'].append('B')"}
      - {texte: "graph['C'].append('B')"}
      - {texte: "graph['B'].append('C')"}
      - {texte: "graph['C'].append('A')"}
    explication: |
      Dans un graphe non orienté, chaque arête apparaît dans les deux listes d'adjacence. Ici, A–C est bien présente dans les deux sens, mais A–B n'apparaît que dans la liste de A. Il faut donc ajouter 'A' dans la liste de B : `graph['B'].append('A')`.
      • `graph['A'].append('B')` et `graph['C'].append('A')` : ces arêtes sont déjà présentes, on créerait un doublon.
      • `graph['C'].append('B')` et `graph['B'].append('C')` : on créerait une arête B–C qui n'existe pas dans le graphe, et elle ne serait elle-même présente que dans un seul sens.


<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a href="#" class="brand" id="brand" aria-label="Retour à l'accueil">
    <svg class="brand-logo" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M24 8v32"/>
      <path d="M24 12c-1-4-8-5-10-1-4 0-6 4-4 7-3 2-3 7 0 9-1 4 2 8 6 7 1 3 6 4 8 0"/>
      <path d="M24 12c1-4 8-5 10-1 4 0 6 4 4 7 3 2 3 7 0 9 1 4-2 8-6 7-1 3-6 4-8 0"/>
      <path d="M16 20c3 0 4 2 4 4M32 20c-3 0-4 2-4 4M16 30c3 0 5-1 5-4M32 30c-3 0-5-1-5-4"/>
    </svg>
    <span>QCM Trainer</span>
  </a>
  <span class="tagline">Entraînez-vous. Progressez.</span>
</header>

<main>
  <div id="error" class="error-box" hidden></div>

  <!-- Accueil : choix du QCM -->
  <section id="screen-home" class="home">
    <svg class="hero" viewBox="0 0 440 230" fill="none" aria-hidden="true">
      <path d="M40 190c-30-30-20-80 30-95 30-9 50 0 70-15 30-25 90-35 120-5 15 15 50-5 85 20 40 29 30 80-5 95z" fill="#ece9fd"/>
      <g transform="rotate(-6 220 120)">
        <rect x="150" y="30" width="170" height="150" rx="14" fill="#fff" stroke="#ddd8fa" stroke-width="2"/>
        <rect x="170" y="56" width="22" height="22" rx="5" fill="#fff" stroke="#5b4fe0" stroke-width="4"/>
        <rect x="170" y="98" width="22" height="22" rx="5" fill="#fff" stroke="#c9c3ef" stroke-width="3"/>
        <rect x="170" y="140" width="22" height="22" rx="5" fill="#fff" stroke="#c9c3ef" stroke-width="3"/>
        <g stroke-linecap="round" stroke-width="6">
          <path d="M206 62h86M206 74h50" stroke="#a79ff0"/>
          <path d="M206 104h90M206 116h56" stroke="#c9c3ef"/>
          <path d="M206 146h80M206 158h44" stroke="#c9c3ef"/>
        </g>
      </g>
      <g stroke="#5b4fe0" stroke-width="4" stroke-linecap="round">
        <path d="M352 30l-8 18M368 52l-18 6M372 82l-20-2"/>
      </g>
    </svg>
    <h1>Choisissez un QCM</h1>
    <p class="subtitle">Sélectionnez une catégorie pour commencer votre entraînement.</p>
    <nav id="list" class="qcm-list" aria-label="Liste des QCM"></nav>
  </section>

  <!-- Passage du QCM -->
  <section id="screen-quiz" class="page" hidden>
    <div class="page-head">
      <button class="link-btn" id="back">‹ Retour</button>
      <h2 id="quiz-title"></h2>
    </div>
    <div class="progress">
      <span id="progress-text"></span>
      <div class="bar"><i id="bar"></i></div>
      <button class="btn" id="submit">Terminer</button>
    </div>
    <div id="questions"></div>
  </section>

  <!-- Résultat et correction -->
  <section id="screen-result" class="page" hidden>
    <div class="page-head">
      <button class="link-btn" id="home">‹ Accueil</button>
      <h2 id="result-title"></h2>
    </div>
    <div class="card score" id="score"></div>
    <div class="toolbar">
      <label class="check"><input type="checkbox" id="only-errors"> Afficher seulement les questions ratées</label>
      <button class="btn" id="retry">Refaire le QCM</button>
    </div>
    <div id="corrections"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>

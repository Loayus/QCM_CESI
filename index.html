<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM - Révisions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --border:#e2e5ea;
    --accent:#2f5bea; --ok:#15803d; --ok-bg:#e7f6ec; --ko:#b91c1c; --ko-bg:#fdecec;
    --miss:#b45309; --miss-bg:#fff4e0; --code-bg:#f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --text:#e8eaee; --muted:#9aa3b2; --border:#2d333d;
      --accent:#7a9bff; --ok:#4ade80; --ok-bg:#12301f; --ko:#f87171; --ko-bg:#3a1a1a;
      --miss:#fbbf24; --miss-bg:#3a2d12; --code-bg:#262b34; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:16px; }
  button, .btn { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:10px 18px;
    background:var(--accent); color:#fff; font-weight:600; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .qcm-item { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .qhead { display:flex; justify-content:space-between; gap:8px; font-size:.85rem; color:var(--muted);
    margin-bottom:8px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .enonce { margin:0 0 12px; }
  .qimg { max-width:100%; height:auto; display:block; margin:0 0 12px; border-radius:6px; }
  .prop .qimg { margin:0; }
  .abs { display:inline-block; padding:4px 10px; border:1px dashed var(--ko); color:var(--ko); border-radius:6px; font-size:.9rem; font-weight:600; margin:0 0 12px; }
  .prop .abs { margin:0; }
  pre { background:var(--code-bg); border-radius:8px; padding:12px 14px; overflow-x:auto;
    font:13.5px/1.45 ui-monospace,Menlo,Consolas,monospace; margin:0 0 12px; }
  code { background:var(--code-bg); border-radius:4px; padding:1px 5px;
    font:.9em ui-monospace,Menlo,Consolas,monospace; }
  pre code { background:none; padding:0; }
  label.prop, .prop { display:flex; gap:12px; align-items:flex-start; padding:10px 12px;
    border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer; }
  .prop:hover { border-color:var(--accent); }
  .prop input { margin-top:5px; flex:none; width:16px; height:16px; }
  .prop .letter { font-weight:700; color:var(--muted); width:1.2em; flex:none; }
  .prop .body { flex:1; min-width:0; overflow-wrap:anywhere; }
  .prop .body pre { margin:0; }
  .progress { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0;
    display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .bar { flex:1; height:8px; background:var(--border); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  .score { text-align:center; }
  .score .big { font-size:3rem; font-weight:800; line-height:1.1; }
  .score .big small { font-size:1.3rem; color:var(--muted); font-weight:600; }
  .stats { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 0; }
  .pill { padding:4px 12px; border-radius:99px; font-size:.9rem; font-weight:600; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); }
  .pill.mid { background:var(--miss-bg); color:var(--miss); }
  .pill.ko { background:var(--ko-bg); color:var(--ko); }
  .res { border-left:5px solid var(--border); }
  .res.ok { border-left-color:var(--ok); } .res.mid { border-left-color:var(--miss); } .res.ko { border-left-color:var(--ko); }
  .pts { font-weight:700; }
  .res.ok .pts { color:var(--ok); } .res.mid .pts { color:var(--miss); } .res.ko .pts { color:var(--ko); }
  .prop.static { cursor:default; }
  .prop.static:hover { border-color:var(--border); }
  .prop.good { background:var(--ok-bg); border-color:var(--ok); }
  .prop.bad { background:var(--ko-bg); border-color:var(--ko); }
  .prop.missed { background:var(--miss-bg); border-color:var(--miss); }
  .tag { font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; align-self:center; }
  .tag.exp { background:var(--ok); color:#fff; } .tag.mine { background:var(--muted); color:#fff; }
  .tag.err { background:var(--ko); color:#fff; }
  .explication { background:var(--code-bg); border-radius:8px; padding:10px 14px; margin-top:10px; font-size:.95rem; }
  .explication b.t { display:block; margin-bottom:4px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:14px; }
  .hint { color:var(--muted); font-size:.9rem; }
  .err-box { background:var(--ko-bg); color:var(--ko); padding:12px 14px; border-radius:8px; margin-bottom:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">QCM</h1>
  <p class="sub" id="subtitle">Choisis un QCM, réponds, puis obtiens ta note et la correction.</p>
  <div id="error" class="err-box" hidden></div>

  <!-- Écran 1 : choix du QCM -->
  <section id="screen-home">
    <div id="list"></div>
    <div class="card">
      <b>Ouvrir un autre fichier .yml</b>
      <p class="hint">Utile si le site est ouvert directement (double-clic sur index.html) ou pour tester un nouveau QCM.</p>
      <input type="file" id="file" accept=".yml,.yaml">
    </div>
  </section>

  <!-- Écran 2 : passage du QCM -->
  <section id="screen-quiz" hidden>
    <div class="progress">
      <span id="progress-text" class="hint"></span>
      <div class="bar"><i id="bar"></i></div>
      <button id="submit">Terminer</button>
    </div>
    <div id="questions"></div>
  </section>

  <!-- Écran 3 : résultat -->
  <section id="screen-result" hidden>
    <div class="card score" id="score"></div>
    <div class="toolbar">
      <label class="hint"><input type="checkbox" id="only-errors"> Afficher seulement les questions ratées</label>
      <button class="secondary" id="retry">Refaire le QCM</button>
      <button class="secondary" id="home">Retour à la liste</button>
    </div>
    <div id="corrections" style="margin-top:16px"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const LETTERS = "ABCDEFGHIJ";
let quiz = null;      // QCM chargé
let answers = [];     // answers[i] = Set d'index cochés

/* ---------- utilitaires ---------- */
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// Mini-formatage : **gras**, `code`, retours à la ligne. Les formules $...$ sont rendues ensuite par KaTeX.
function fmt(s) {
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
}
function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters:[{left:"$",right:"$",display:false}], throwOnError:false });
  }
}
function showError(msg) { const e=$("error"); e.textContent=msg; e.hidden=!msg; }
function show(screen) {
  for (const s of ["home","quiz","result"]) $("screen-"+s).hidden = (s!==screen);
  window.scrollTo(0,0);
}

/* ---------- chargement des YAML ---------- */
async function fetchYaml(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " : HTTP " + r.status);
  return jsyaml.load(await r.text());
}

async function init() {
  try {
    const idx = await fetchYaml("qcm/index.yml");
    const list = $("list");
    for (const item of idx.qcm) {
      const d = document.createElement("div");
      d.className = "card qcm-item";
      d.innerHTML = `<div><b>${esc(item.titre)}</b><div class="hint">${esc(item.fichier)}</div></div>`;
      const b = document.createElement("button");
      b.textContent = "Commencer";
      b.onclick = async () => {
        try { start(await fetchYaml("qcm/" + item.fichier)); } catch (e) { showError("Impossible de charger le QCM : " + e.message); }
      };
      d.appendChild(b);
      list.appendChild(d);
    }
  } catch (e) {
    showError("Liste des QCM indisponible (" + e.message + "). Si tu as ouvert index.html par double-clic, " +
      "lance plutôt « python3 -m http.server » dans ce dossier, ou utilise « Ouvrir un autre fichier .yml » ci-dessous.");
  }
}

$("file").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try { start(jsyaml.load(await f.text())); } catch (e) { showError("Fichier YAML invalide : " + e.message); }
};

/* ---------- passage du QCM ---------- */
function start(data) {
  showError("");
  if (!data || !Array.isArray(data.questions) || !data.questions.length) { showError("Ce fichier ne contient aucune question."); return; }
  quiz = data;
  answers = quiz.questions.map(() => new Set());
  $("title").textContent = quiz.titre || "QCM";
  $("subtitle").textContent = quiz.questions.length + " questions - note sur " + (quiz.note_sur || 20);
  const box = $("questions"); box.innerHTML = "";

  quiz.questions.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "card";
    const multi = q.type === "multiple";
    let h = `<div class="qhead"><span>Question ${qi+1}</span><span>${multi ? "Réponses multiples" : "Réponse unique"}</span></div>`;
    if (q.enonce) h += `<p class="enonce">${fmt(q.enonce)}</p>`;
    h += media(q);
    q.propositions.forEach((p, pi) => {
      h += `<label class="prop"><input type="${multi ? "checkbox" : "radio"}" name="q${qi}" data-q="${qi}" data-p="${pi}">
        <span class="letter">${LETTERS[pi]}</span><span class="body">${propBody(p)}</span></label>`;
    });
    card.innerHTML = h;
    box.appendChild(card);
  });
  box.querySelectorAll("input").forEach(inp => inp.onchange = onAnswer);
  renderMath(box);
  updateProgress();
  show("quiz");
}

// Image (qcm/<chemin>) ; si le fichier est absent, on affiche "image abs".
function imgHtml(src) {
  return `<img class="qimg" src="qcm/${esc(src)}" alt="" data-src="${esc(src)}" onerror="imgFallback(this)">`;
}
function imgFallback(img) {
  const span = document.createElement("span");
  span.className = "abs";
  span.textContent = "image abs (" + img.dataset.src + ")";
  img.replaceWith(span);
}
// Médias d'une question : image et/ou bloc de code
function media(q) {
  let h = "";
  if (q.image) h += imgHtml(q.image);
  if (q.code) h += `<pre><code>${esc(q.code.replace(/\n+$/,""))}</code></pre>`;
  return h;
}
function propBody(p) {
  if (p.image) return imgHtml(p.image);
  if (p.texte == null) return "";
  return p.code ? `<pre><code>${esc(p.texte.replace(/\n+$/,""))}</code></pre>` : fmt(p.texte);
}

function onAnswer(ev) {
  const qi = +ev.target.dataset.q, pi = +ev.target.dataset.p;
  const multi = quiz.questions[qi].type === "multiple";
  if (!multi) answers[qi] = new Set();
  if (ev.target.checked) answers[qi].add(pi); else answers[qi].delete(pi);
  updateProgress();
}

function updateProgress() {
  const done = answers.filter(s => s.size > 0).length, n = quiz.questions.length;
  $("progress-text").textContent = done + " / " + n + " répondues";
  $("bar").style.width = (100 * done / n) + "%";
}

/* ---------- notation ---------- */
function gradeQuestion(q, given) {
  const expected = new Set(q.propositions.map((p,i) => p.correcte ? i : -1).filter(i => i >= 0));
  let disc = 0;
  q.propositions.forEach((_, i) => { if (expected.has(i) !== given.has(i)) disc++; });
  let pts = 0;
  if (given.size > 0) {
    const table = q.bareme || (quiz.bareme && quiz.bareme[q.type]) || {};
    pts = table[disc] ?? 0;
  }
  return { expected, disc, pts, answered: given.size > 0 };
}

$("submit").onclick = () => {
  const missing = answers.filter(s => s.size === 0).length;
  if (missing && !confirm(missing + " question(s) sans réponse (0 point). Terminer quand même ?")) return;
  showResult();
};

function showResult() {
  const n = quiz.questions.length, sur = quiz.note_sur || 20;
  const results = quiz.questions.map((q, i) => gradeQuestion(q, answers[i]));
  const total = results.reduce((a, r) => a + r.pts, 0);
  const note = total / n * sur;
  const full = results.filter(r => r.pts === 1).length;
  const zero = results.filter(r => r.pts === 0).length;
  const part = n - full - zero;
  const fmtN = (x) => (Math.round(x * 100) / 100).toString().replace(".", ",");

  $("score").innerHTML = `<div class="big">${fmtN(note)} <small>/ ${sur}</small></div>
    <div class="hint">${fmtN(total)} points sur ${n}</div>
    <div class="stats"><span class="pill ok">${full} correcte(s)</span>
    <span class="pill mid">${part} partielle(s)</span><span class="pill ko">${zero} à 0</span></div>`;

  const box = $("corrections"); box.innerHTML = "";
  quiz.questions.forEach((q, qi) => {
    const r = results[qi], given = answers[qi];
    const cls = r.pts === 1 ? "ok" : r.pts === 0 ? "ko" : "mid";
    const card = document.createElement("div");
    card.className = "card res " + cls; card.dataset.cls = cls;
    let h = `<div class="qhead"><span>Question ${qi+1}</span>
      <span class="pts">${fmtN(r.pts)} / 1${r.answered ? "" : " - pas de réponse"}${r.answered && r.disc ? " - " + r.disc + " discordance" + (r.disc>1?"s":"") : ""}</span></div>`;
    if (q.enonce) h += `<p class="enonce">${fmt(q.enonce)}</p>`;
    h += media(q);
    q.propositions.forEach((p, pi) => {
      const exp = r.expected.has(pi), mine = given.has(pi);
      const state = exp && mine ? "good" : exp ? "missed" : mine ? "bad" : "";
      let tags = "";
      if (exp) tags += `<span class="tag exp">Attendue</span>`;
      if (mine) tags += `<span class="tag ${exp ? "mine" : "err"}">Ta réponse</span>`;
      h += `<div class="prop static ${state}"><span class="letter">${LETTERS[pi]}</span>
        <span class="body">${propBody(p)}</span>${tags}</div>`;
    });
    if (q.explication || q.explication_image) h += `<div class="explication"><b class="t">Explication</b>${q.explication ? fmt(q.explication) : ""}${q.explication_image ? imgHtml(q.explication_image) : ""}</div>`;
    card.innerHTML = h;
    box.appendChild(card);
  });
  renderMath(box);
  $("only-errors").checked = false;
  filterErrors();
  show("result");
}

function filterErrors() {
  const only = $("only-errors").checked;
  document.querySelectorAll("#corrections .res").forEach(c => c.hidden = only && c.dataset.cls === "ok");
}
$("only-errors").onchange = filterErrors;
$("retry").onclick = () => start(quiz);
$("home").onclick = () => { $("title").textContent = "QCM"; $("subtitle").textContent = "Choisis un QCM, réponds, puis obtiens ta note et la correction."; show("home"); };

init();
</script>
</body>
</html>
